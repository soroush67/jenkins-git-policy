# yaml-language-server: $schema=../../schema/policy.v1.schema.json
# Step 5: rules for particular branches and tags (refs).
apiVersion: git-policy/v1
kind: GitPolicy
metadata:
  name: acme-git-policy
  revision: 5
mandatory:
  blocked_extensions: [dll, exe]
  blocked_signatures: [pe]
  max_file_size: 50MiB
  deny_users: [terminated.user]
defaults:
  blocked_extensions: [pdb, nupkg, zip, 7z, msi]
  blocked_paths: ["**/bin/Debug/**", "**/bin/Release/**", "**/obj/**", "**/packages/**"]
  max_file_size: 20MiB
  refs:
    "refs/tags/**":                   # every tag in every project
      max_file_size: 5MiB
namespaces:
  finance:
    blocked_extensions: [pfx, p12]
    max_file_size: 10MiB
    refs:
      "refs/heads/release/**":        # release branches of finance only
        blocked_extensions: [pdf]
projects:
  finance/reporting:
    unblock_extensions: [zip]
  data/models:
    max_file_size: 45MiB
  sandbox/playground:
    enabled: false
