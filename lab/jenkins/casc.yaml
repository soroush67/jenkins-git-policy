# Jenkins configuration as code (lab). Secrets are read from files mounted
# under /run/secrets and from the environment, never stored here.
jenkins:
  systemMessage: "git-policy control plane (lab)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
        - id: approver
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: git-policy-ssh-test
              username: gitpolicy-deploy
              description: "SSH key for the git-policy-ctl forced-command channel (TEST)"
              privateKeySource:
                directEntry:
                  privateKey: ${readFile:/run/secrets/git-policy-ssh-key}
          - string:
              scope: GLOBAL
              id: gitlab-api-readonly
              description: "GitLab API token (read_api) for membership sync"
              secret: ${readFile:/run/secrets/gitlab-api-token}
unclassified:
  location:
    url: http://localhost:8081/
jobs:
  # Pipelines live in jenkins/pipelines/*.groovy (copied into the image);
  # Job DSL only creates the jobs and loads each script from its file.
  - script: |
      ['git-policy-status', 'git-policy-sync-membership'].each { name ->
        pipelineJob(name) {
          definition {
            cps {
              script(new File("/usr/share/jenkins/ref/pipelines/" + name + ".groovy").text)   // string concatenation on purpose: JCasC interpolates dollar-brace itself
              sandbox(true)
            }
          }
        }
      }
