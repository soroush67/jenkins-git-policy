# yaml-language-server: $schema=../../schema/policy.v1.schema.json
# Step 3: organisation-wide defaults (can be tuned per namespace/project).
apiVersion: git-policy/v1
kind: GitPolicy
metadata:
  name: acme-git-policy
  revision: 3
mandatory:
  blocked_extensions: [dll, exe]
  blocked_signatures: [pe]
  max_file_size: 50MiB
  deny_users: [terminated.user]
defaults:
  blocked_extensions: [pdb, nupkg, zip, 7z, msi]
  blocked_paths:
    - "**/bin/Debug/**"
    - "**/bin/Release/**"
    - "**/obj/**"
    - "**/packages/**"
  max_file_size: 20MiB
